<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PackTactics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="data:application/manifest+json,{
    &quot;name&quot;: &quot;PackTactics&quot;,
    &quot;short_name&quot;: &quot;PackTactics&quot;,
    &quot;start_url&quot;: &quot;.&quot;,
    &quot;display&quot;: &quot;standalone&quot;,
    &quot;background_color&quot;: &quot;#0f172a&quot;,
    &quot;theme_color&quot;: &quot;#0f172a&quot;
  }">
  <style>
    body { background-color: #0b0f19; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="pb-12 min-h-screen">
  <!-- Header -->
  <header class="p-4 border-b border-slate-800 flex justify-between items-center sticky top-0 bg-[#0b0f19]/90 backdrop-blur z-50">
    <div>
      <h1 class="text-xl font-extrabold tracking-wider text-emerald-400">PACK<span class="text-slate-100">TACTICS</span></h1>
      <p class="text-xs text-slate-400 font-medium">Matchday & Packing Hub</p>
    </div>
    <div class="bg-emerald-500/10 border border-emerald-500/30 px-3 py-1 rounded-full text-xs text-emerald-400 font-semibold">
      Match Mode
    </div>
  </header>

  <main class="p-4 max-w-md mx-auto space-y-5">
    <!-- Countdown Card -->
    <div class="glass rounded-2xl p-4 shadow-xl">
      <h2 class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-3">Odliczanie do Wyjazdu</h2>
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
          <span id="leaveTimer" class="block text-lg font-bold text-amber-400">--:--</span>
          <span class="text-[10px] text-slate-400">Wyjazd</span>
        </div>
        <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
          <span id="gathTimer" class="block text-lg font-bold text-sky-400">--:--</span>
          <span class="text-[10px] text-slate-400">Zbiórka</span>
        </div>
        <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
          <span id="matchTimer" class="block text-lg font-bold text-emerald-400">--:--</span>
          <span class="text-[10px] text-slate-400">Mecz</span>
        </div>
      </div>
    </div>

    <!-- Time Setup -->
    <details class="glass rounded-2xl p-4 cursor-pointer">
      <summary class="text-sm font-semibold text-slate-200 flex justify-between items-center">
        ⚙️ Ustawienia Godzinowe
      </summary>
      <div class="mt-3 space-y-3 pt-3 border-t border-slate-800 text-xs">
        <div class="flex justify-between items-center">
          <label class="text-slate-400">Wyjazd z domu:</label>
          <input type="time" id="inputLeave" value="12:15" onchange="updateTimers()" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-white">
        </div>
        <div class="flex justify-between items-center">
          <label class="text-slate-400">Zbiórka:</label>
          <input type="time" id="inputGath" value="13:30" onchange="updateTimers()" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-white">
        </div>
        <div class="flex justify-between items-center">
          <label class="text-slate-400">Rozpoczęcie meczu:</label>
          <input type="time" id="inputMatch" value="15:00" onchange="updateTimers()" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-white">
        </div>
      </div>
    </details>

    <!-- Tag Selectors -->
    <div class="glass rounded-2xl p-4">
      <h2 class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-3">Warunki Meczowe</h2>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <button onclick="toggleTag('zimno')" id="tag-zimno" class="p-2.5 rounded-xl border text-left transition bg-slate-800 border-slate-700 text-slate-400">
          ❄️ Zimno (<10°C)
        </button>
        <button onclick="toggleTag('deszcz')" id="tag-deszcz" class="p-2.5 rounded-xl border text-left transition bg-slate-800 border-slate-700 text-slate-400">
          🌧️ Deszcz / Mokro
        </button>
        <button onclick="toggleTag('ag')" id="tag-ag" class="p-2.5 rounded-xl border text-left transition bg-slate-800 border-slate-700 text-slate-400">
          🌱 Murawa Sztuczna
        </button>
        <button onclick="toggleTag('sg')" id="tag-sg" class="p-2.5 rounded-xl border text-left transition bg-slate-800 border-slate-700 text-slate-400">
          🌧️ Murawa Grząska
        </button>
      </div>
    </div>

    <!-- Packing Progress -->
    <div>
      <div class="flex justify-between text-xs font-semibold mb-1">
        <span class="text-slate-300">Postęp Pakowania</span>
        <span id="progressPercent" class="text-emerald-400">0%</span>
      </div>
      <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
      </div>
    </div>

    <!-- Dynamic Checklist -->
    <div id="checklistContainer" class="space-y-4"></div>
  </main>

  <script>
    const database = [
      { id: 1, item: "Ręcznik + Żel + Antyperspirant", pocket: "Dolna Komora (Spód)", tag: "baza", sub: "Do otwarcia pod prysznicem" },
      { id: 2, item: "Soczewki w etui + Krople do oczu", pocket: "Komora Boczna", tag: "baza", sub: "" },
      { id: 3, item: "Kluczyki + Telefon + Zegarek", pocket: "Komora Boczna", tag: "baza", sub: "" },
      { id: 4, item: "Nożyczki + Tejp / Taśma do getrów", pocket: "Komora Boczna", tag: "baza", sub: "" },
      { id: 5, item: "Maść rozgrzewająca", pocket: "Komora Boczna", tag: "zimno", sub: "Aktywowane przez: #zimno" },
      { id: 6, item: "Korki Lanki (FG)", pocket: "Komora Główna", tag: "fg", sub: "Nawierzchnia naturalna" },
      { id: 7, item: "Korki Sztuczna Trawa (AG/Turfy)", pocket: "Komora Główna", tag: "ag", sub: "Nawierzchnia sztuczna" },
      { id: 8, item: "Korki Wkręty / Mixy (SG)", pocket: "Komora Główna", tag: "sg", sub: "Mokra / grząska murawa" },
      { id: 9, item: "Klapki pod prysznic", pocket: "Komora Główna", tag: "baza", sub: "" },
      { id: 10, item: "Getry + Ochraniacze + Spodenki", pocket: "Komora Główna", tag: "baza", sub: "" },
      { id: 11, item: "Bielizna termoaktywna + Komin", pocket: "Komora Główna", tag: "zimno", sub: "Aktywowane przez: #zimno" },
      { id: 12, item: "Rękawiczki meczowe + Czapka", pocket: "Komora Główna", tag: "zimno", sub: "Aktywowane przez: #zimno" },
      { id: 13, item: "Ortalion / Kurtka deszczowa", pocket: "Komora Główna", tag: "deszcz", sub: "Aktywowane przez: #deszcz" },
      { id: 14, item: "Zapasowa para getrów/skarpet", pocket: "Komora Główna", tag: "deszcz", sub: "Aktywowane przez: #deszcz" },
      { id: 15, item: "Pojemniki z jedzeniem", pocket: "Pojemniki & Nawodnienie", tag: "baza", sub: "Przed- i poregeneracyjny" },
      { id: 16, item: "Bidon z izotonikiem", pocket: "Pojemniki & Nawodnienie", tag: "baza", sub: "" }
    ];

    let activeTags = new Set(["baza", "fg"]);
    let checkedItems = new Set();

    function toggleTag(tag) {
      if(tag === 'ag' || tag === 'sg') {
        activeTags.delete('fg'); activeTags.delete('ag'); activeTags.delete('sg');
      }
      if(activeTags.has(tag)) activeTags.delete(tag);
      else activeTags.add(tag);
      if(!activeTags.has('ag') && !activeTags.has('sg')) activeTags.add('fg');
      
      updateTagUI();
      renderChecklist();
    }

    function updateTagUI() {
      ['zimno', 'deszcz', 'ag', 'sg'].forEach(t => {
        const btn = document.getElementById(`tag-${t}`);
        if(activeTags.has(t)) {
          btn.className = "p-2.5 rounded-xl border text-left transition bg-emerald-500/10 border-emerald-500/50 text-emerald-400 font-semibold";
        } else {
          btn.className = "p-2.5 rounded-xl border text-left transition bg-slate-800 border-slate-700 text-slate-400";
        }
      });
    }

    function renderChecklist() {
      const container = document.getElementById('checklistContainer');
      container.innerHTML = '';

      const filtered = database.filter(i => activeTags.has(i.tag));
      const grouped = {};

      filtered.forEach(item => {
        if(!grouped[item.pocket]) grouped[item.pocket] = [];
        grouped[item.pocket].push(item);
      });

      let total = filtered.length;
      let checkedCount = 0;

      Object.keys(grouped).forEach(pocket => {
        const section = document.createElement('div');
        section.className = 'glass rounded-2xl p-4';
        
        let html = `<h3 class="text-xs uppercase tracking-wider text-slate-400 font-semibold mb-3">${pocket}</h3><div class="space-y-2">`;
        
        grouped[pocket].forEach(i => {
          const isChecked = checkedItems.has(i.id);
          if(isChecked) checkedCount++;
          
          html += `
            <label class="flex items-start gap-3 p-2 rounded-xl hover:bg-slate-800/50 cursor-pointer transition">
              <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleCheck(${i.id})" class="mt-0.5 w-4 h-4 rounded border-slate-700 text-emerald-500 focus:ring-0 bg-slate-900">
              <div>
                <span class="text-sm block ${isChecked ? 'line-through text-slate-500' : 'text-slate-200'}">${i.item}</span>
                ${i.sub ? `<span class="text-[10px] text-slate-400 block">${i.sub}</span>` : ''}
              </div>
            </label>
          `;
        });

        html += `</div>`;
        section.innerHTML = html;
        container.appendChild(section);
      });

      const pct = total > 0 ? Math.round((checkedCount / total) * 100) : 0;
      document.getElementById('progressPercent').innerText = `${pct}%`;
      document.getElementById('progressBar').style.width = `${pct}%`;
    }

    function toggleCheck(id) {
      if(checkedItems.has(id)) checkedItems.delete(id);
      else checkedItems.add(id);
      renderChecklist();
    }

    function updateTimers() {
      const now = new Date();
      ['Leave', 'Gath', 'Match'].forEach(type => {
        const val = document.getElementById(`input${type}`).value;
        if(!val) return;
        const [h, m] = val.split(':');
        const target = new Date();
        target.setHours(h, m, 0);
        
        let diff = target - now;
        if(diff < 0) diff += 24 * 3600 * 1000;
        
        const hrs = Math.floor(diff / (1000 * 3600));
        const mins = Math.floor((diff % (1000 * 3600)) / (1000 * 60));
        
        document.getElementById(`${type.toLowerCase()}Timer`).innerText = `${hrs}h ${mins}m`;
      });
    }

    updateTagUI();
    renderChecklist();
    updateTimers();
    setInterval(updateTimers, 60000);
  </script>
</body>
</html>
